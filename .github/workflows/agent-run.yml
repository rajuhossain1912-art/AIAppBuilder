name: AIAppBuilder Agent Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project identifier (letters, numbers, hyphen, underscore)'
        required: true
        default: 'client-project'
        type: string
      request:
        description: 'Application request in Bangla, Banglish, English, or mixed language'
        required: true
        type: string
      action:
        description: 'review first, or generate and run the full release cycle after approval'
        required: true
        default: 'review'
        type: choice
        options:
          - review
          - generate
      approved:
        description: 'Explicit approval for source generation and release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Refuse execution on a public repository
        run: |
          echo 'AIAppBuilder must be private before client requests or persistent runtime state are used.'
          echo 'Change repository visibility to Private, then run this workflow again.'
          exit 1

  agent:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == true }}
    env:
      AIAPPBUILDER_ALLOW_PERSISTENT_CLIENT_DATA: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python checks
        run: python -m unittest discover -s agent -p 'test_*.py' -v

      - name: Review request
        if: ${{ inputs.action == 'review' }}
        env:
          AIAPPBUILDER_REQUEST: ${{ inputs.request }}
        run: |
          python -m agent.entrypoint \
            --project-id "${{ inputs.project_id }}" \
            --state-root "memory/runtime" \
            intake "$AIAPPBUILDER_REQUEST"

      - name: Generate approved Android source
        if: ${{ inputs.action == 'generate' && inputs.approved == true }}
        env:
          AIAPPBUILDER_REQUEST: ${{ inputs.request }}
        run: |
          python -m agent.entrypoint \
            --project-id "${{ inputs.project_id }}" \
            --state-root "memory/runtime" \
            --work-root "build/agent-work" \
            intake "$AIAPPBUILDER_REQUEST"
          python -m agent.entrypoint \
            --project-id "${{ inputs.project_id }}" \
            --state-root "memory/runtime" \
            --work-root "build/agent-work" \
            generate --approve

      - name: Set up Java for Android release cycle
        if: ${{ inputs.action == 'generate' && inputs.approved == true }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ inputs.action == 'generate' && inputs.approved == true }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run REVIEW BUILD TEST VERIFY FIX-RETRY DELIVERY
        if: ${{ inputs.action == 'generate' && inputs.approved == true }}
        run: |
          python -m agent.entrypoint \
            --project-id "${{ inputs.project_id }}" \
            --state-root "memory/runtime" \
            --work-root "build/agent-work" \
            release --approve --max-retries 2

      - name: Upload generated project, APK, state and recovery evidence
        if: ${{ inputs.action == 'generate' && inputs.approved == true }}
        uses: actions/upload-artifact@v4
        with:
          name: aiappbuilder-${{ inputs.project_id }}
          path: |
            build/agent-work/${{ inputs.project_id }}/
            memory/runtime/${{ inputs.project_id }}/
          if-no-files-found: error

      - name: Persist resumable runtime state
        if: ${{ always() && github.event.repository.private == true }}
        run: |
          git config user.name 'AIAppBuilder Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add memory/runtime || true
          if git diff --cached --quiet; then
            echo 'No runtime-state changes to commit.'
          else
            git commit -m "Persist AIAppBuilder agent runtime state"
            git push
          fi

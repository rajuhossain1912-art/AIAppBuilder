name: AIAppBuilder Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run lifecycle release-cycle tests
        run: python -m unittest agent.orchestrator.test_release_cycle -v

      - name: Run requirement capability tests
        run: python -m unittest discover -s agent/requirements -p 'test_*.py' -v

      - name: Run Android generator and composition tests
        run: python -m unittest discover -s agent/android -p 'test_*.py' -v

      - name: Run security and privacy tests
        run: python -m unittest discover -s agent/security -p 'test_*.py' -v

      - name: Generate feature-complete CI app through pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          from agent.pipeline import AgentPipeline
          from agent.security import PrivacyGuard
          from agent.verification import (
              AndroidAccessibilityVerifier,
              AndroidCompletenessVerifier,
              AndroidCompatibilityVerifier,
              CompletenessStatus,
              VerificationStatus,
          )

          request = (
              'Create an accessible offline multimedia utility with calculator, '
              'audio editor trim split preview export, video editor trim split preview export, '
              'text to speech, music tones, image selection and video selection.'
          )
          pipeline = AgentPipeline()
          intake = pipeline.intake(request)
          generated = pipeline.generate_android(
              intake,
              Path('build/ci-android-app'),
              approved=True,
          )
          source_path = generated.project.root / generated.features.files[0]
          source = source_path.read_text(encoding='utf-8')
          assert 'Double.parseDouble' in source
          assert 'MediaExtractor' in source
          assert 'MediaMuxer' in source
          assert 'Trim and export' in source
          assert 'Trim and export video' in source
          assert 'TextToSpeech' in source
          assert 'AudioTrack' in source
          assert 'setContentDescription' in source
          accessibility = AndroidAccessibilityVerifier().verify_source('ci-project', source_path)
          assert accessibility.final_status == VerificationStatus.VERIFIED
          completeness = AndroidCompletenessVerifier().verify_project('ci-project', generated.project.root)
          assert completeness.status == CompletenessStatus.VERIFIED, completeness.findings
          compatibility = AndroidCompatibilityVerifier().verify_project('ci-project', generated.project.root)
          assert compatibility.final_status == VerificationStatus.VERIFIED
          privacy = PrivacyGuard().inspect_source(generated.project.root, generated.features.files)
          assert privacy.passed, privacy.findings
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build/ci-android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -f build/ci-android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiappbuilder-ci-debug-apk
          path: build/ci-android-app/app/build/outputs/apk/debug/app-debug.apk

name: AIAppBuilder Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate feature-complete CI app through pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          from agent.pipeline import AgentPipeline

          request = 'Create an accessible calculator app that works offline.'
          pipeline = AgentPipeline()
          intake = pipeline.intake(request)
          generated = pipeline.generate_android(
              intake,
              Path('build/ci-android-app'),
              approved=True,
          )
          assert generated.intent.family == 'utility'
          source = (generated.project.root / generated.features.files[0]).read_text(encoding='utf-8')
          assert 'Double.parseDouble' in source
          assert 'setContentDescription' in source
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build/ci-android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -f build/ci-android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiappbuilder-ci-debug-apk
          path: build/ci-android-app/app/build/outputs/apk/debug/app-debug.apk
